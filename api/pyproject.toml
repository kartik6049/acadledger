[project]
name = "acadledger-api"
version = "0.1.0"
description = "AcadLedger API: APAAR-linked student records and verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "celery[redis]>=5.4",
    "boto3>=1.35",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.8",
    "faker>=33",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: load-style tests that take a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends()/File()/Query() defaults are the documented idiom
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# autogenerated by Alembic; long lines are not worth hand-wrapping
"migrations/versions/*" = ["E501"]
